<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CPTR Live Computer</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="popup-body">
  <main class="popup-card">
    <p class="eyebrow">CPTR LIVE COMPUTER</p>
    <div class="status-row">
      <strong id="state">Checking…</strong>
      <span class="dot" aria-hidden="true"></span>
    </div>
    <p id="detail" class="muted">Reading device status…</p>
    <button id="open-options" class="primary" type="button">Open setup</button>
    <p class="footer-link"><a href="https://github.com/heidi-dang/chatgpt-chrome-extension" target="_blank" rel="noreferrer">heidi-dang / GitHub</a></p>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
